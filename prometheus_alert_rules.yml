groups:
- name: agent-orchestrator.rules
  rules:
  - alert: AgentDLQHigh
    expr: agent_dlq_size > 5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "DLQ too large for agent ({{ $labels.agent }})"
      description: "Dead-letter queue for agent {{ $labels.agent }} has more than 5 entries for the last 5 minutes."

  - alert: AgentHeartbeatMissing
    expr: agent_heartbeat_age_seconds > 30
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Agent heartbeat missing or stale ({{ $labels.agent }})"
      description: "Agent {{ $labels.agent }} heartbeat age is > 30s. Check agent process and connectivity."

